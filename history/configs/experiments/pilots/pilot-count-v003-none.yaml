experiment:
  id: pilot-count-v003-none
  task_family: count
  notes: >-
    Pilot on miq-train-v003: partial credit with full credit for a correct
    "none" and a 0.5 penalty for a wrong one. Judged on the dev split only.

model:
  id: Qwen/Qwen2.5-0.5B-Instruct
  revision: null
  dtype: bfloat16
  attn_implementation: null
  peft:
    enabled: false

data:
  artifact_id: miq-train-v003
  split: count
  dev_split: count_dev
  expected_hash: 04c7966083a06646513cd7ad28eb4b1bf23525c6c68227d9c4988cc69c790b54

grpo:
  learning_rate: 3.0e-6
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 10
  weight_decay: 0.0
  max_grad_norm: 1.0

  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4
  num_generations: 16

  max_completion_length: 512

  temperature: 1.0
  top_p: 1.0
  top_k: 0
  min_p: null
  repetition_penalty: 1.0

  beta: 0.0
  epsilon: 0.2
  epsilon_high: null
  loss_type: dapo
  scale_rewards: group
  num_iterations: 1
  mask_truncated_completions: false

  max_steps: 300
  num_train_epochs: 1.0
  gradient_checkpointing: true
  bf16: true

rewards:
  correctness_weight: 1.0
  partial_weight: 1.0
  trivial_weight: 1.0
  none_penalty: 0.5
  format_weight: 0.0
  validity_weight: 0.0

runtime:
  seed: 42
  logging_steps: 5
  save_steps: 100
  save_total_limit: 1
  eval_steps: 100
  eval_on_start: true
  eval_max_examples: 400
  num_generations_eval: 4
  per_device_eval_batch_size: 16
  log_completions: true
  num_completions_to_print: 4
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.1
  report_to: none
  dataloader_num_workers: 0

benchmark_integrity:
  official_benchmark_used_for_training: false
  official_benchmark_used_for_hparam_selection: false
  official_benchmark_used_for_prompt_tuning: false
  official_benchmark_used_for_extraction_tuning: false
  official_benchmark_used_for_checkpoint_selection: false
  official_benchmark_run_ids: []
