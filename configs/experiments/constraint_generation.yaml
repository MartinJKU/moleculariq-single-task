# GRPO on constrained generation questions (final model).
#   python -m miqgrpo.train_grpo train --config configs/experiments/constraint_generation.yaml

experiment:
  id: constraint_generation
  task_family: constraint_generation
  notes: >-
    Constrained generation: official score plus credit per constraint met, 3,000 steps.

model:
  id: Qwen/Qwen2.5-0.5B-Instruct  # base model
  revision: null
  dtype: bfloat16
  attn_implementation: null
  peft:
    enabled: false  # false = full fine-tuning

data:
  artifact_id: miq-train  # frozen dataset
  split: constraint_generation
  dev_split: constraint_generation_dev  # held-out questions scored during training
  expected_hash: f146ee7cb496794186dbf57a3183f339157b2299840f2ee48ef83c23392d68df  # training refuses data with another content hash

grpo:
  learning_rate: 3.0e-6
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 10
  weight_decay: 0.0
  max_grad_norm: 1.0

  per_device_train_batch_size: 16  # completions per micro-batch
  gradient_accumulation_steps: 4  # micro-batches per optimizer step
  num_generations: 16  # answers per question (one GRPO group)

  max_completion_length: 512  # max new tokens per answer

  temperature: 1.0
  top_p: 1.0
  top_k: 0  # 0 = off
  min_p: null
  repetition_penalty: 1.0

  beta: 0.0  # no KL term
  epsilon: 0.2
  epsilon_high: null
  loss_type: dapo  # token-level loss (DAPO)
  scale_rewards: group  # advantage divided by the group's std
  num_iterations: 1
  mask_truncated_completions: false

  max_steps: 3000
  num_train_epochs: 1.0
  gradient_checkpointing: true
  bf16: true

rewards:
  correctness_weight: 1.0  # official score of the whole question
  partial_weight: 1.0  # credit per requested property
  trivial_weight: 0.25  # weight of properties whose true value is 0 / []

runtime:
  seed: 42
  logging_steps: 5
  save_steps: 250
  save_total_limit: 1
  eval_steps: 250  # dev-split evaluation interval (never the benchmark)
  eval_on_start: true  # step 0 = the base model
  eval_max_examples: 400
  num_generations_eval: 4
  per_device_eval_batch_size: 16
  log_completions: true
  num_completions_to_print: 4
  use_vllm: true  # vLLM rollouts
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.1  # GPU share for vLLM (speed only)
  report_to: none
  dataloader_num_workers: 0

benchmark_integrity:  # declarations copied into the run's provenance
  official_benchmark_used_for_training: false
  official_benchmark_used_for_hparam_selection: false
  official_benchmark_used_for_prompt_tuning: false
  official_benchmark_used_for_extraction_tuning: false
  official_benchmark_used_for_checkpoint_selection: false
  official_benchmark_run_ids: []
