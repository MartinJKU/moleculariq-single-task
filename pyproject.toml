[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miqgrpo"
version = "0.1.0"
description = "Single-task GRPO training of Qwen2.5-0.5B-Instruct on MolecularIQ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "torch>=2.6,<3.0",
  "transformers>=5.0,<6.0",
  "trl==1.13.0",
  "accelerate>=1.10",
  "datasets>=4.0",
  "moleculariq-core @ git+https://github.com/ml-jku/moleculariq-core.git@a1b89635371c3cd942e44ebeec63ec3665e7743d",
  "rdkit>=2023.3.1",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "huggingface-hub>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
peft = ["peft>=0.14"]
vllm = ["vllm>=0.8", "ray>=2.9"]

[project.scripts]
miq-build-dataset = "miqgrpo.build_dataset:main"
miq-train = "miqgrpo.train_grpo:main"
miq-evaluate = "miqgrpo.evaluate:main"
miq-report = "miqgrpo.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
