# Supervised warm-up on worked solutions: constrained generation, 0.5B.
#   python -m miqgrpo.train_sft train --config extension/configs/sft/constraint_generation-0.5b.yaml

experiment:
  id: sft-constraint_generation-0.5b
  task_family: constraint_generation
  notes: >-
    Supervised warm-up on worked solutions, 0.5B.

model:
  id: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16

data:
  artifact_id: miq-sft
  split: constraint_generation
  expected_hash: 2367614dcda3b5a9f5cb7d7b956d57adb91bdfb9695793545e6478313c4a0dad

sft:
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
