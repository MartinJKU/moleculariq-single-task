# Extension: GRPO on index attribution, 1.5B, after the supervised warm-up.
#   python -m miqgrpo.train_grpo train --config extension/configs/grpo/index-1.5b.yaml

experiment:
  id: index-1.5b
  task_family: index
  notes: >-
    Extension: index attribution, 1.5B, supervised warm-up then the root GRPO recipe.

model:
  id: Qwen/Qwen2.5-1.5B-Instruct
  revision: null
  init_from: sft-index-1.5b
  dtype: bfloat16
  attn_implementation: null
  peft:
    enabled: false

data:
  artifact_id: miq-train
  split: index
  dev_split: index_dev
  expected_hash: f146ee7cb496794186dbf57a3183f339157b2299840f2ee48ef83c23392d68df

grpo:
  learning_rate: 3.0e-6
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 10
  weight_decay: 0.0
  max_grad_norm: 1.0

  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4
  num_generations: 16

  max_completion_length: 1536

  temperature: 1.0
  top_p: 1.0
  top_k: 0
  min_p: null
  repetition_penalty: 1.0

  beta: 0.0
  epsilon: 0.2
  epsilon_high: null
  loss_type: dapo
  scale_rewards: group
  num_iterations: 1
  mask_truncated_completions: false

  max_steps: 1000
  num_train_epochs: 1.0
  gradient_checkpointing: true
  bf16: true

rewards:
  correctness_weight: 1.0
  partial_weight: 1.0
  trivial_weight: 1.0
  none_penalty: 0.25

runtime:
  seed: 42
  logging_steps: 5
  save_steps: 250
  save_total_limit: 1
  eval_steps: 100
  eval_on_start: true
  eval_max_examples: 400
  num_generations_eval: 4
  per_device_eval_batch_size: 16
  log_completions: true
  num_completions_to_print: 4
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.1
  report_to: none
  dataloader_num_workers: 0

benchmark_integrity:
  official_benchmark_used_for_training: false
  official_benchmark_used_for_hparam_selection: false
  official_benchmark_used_for_prompt_tuning: false
  official_benchmark_used_for_extraction_tuning: false
  official_benchmark_used_for_checkpoint_selection: false
  official_benchmark_run_ids: []
